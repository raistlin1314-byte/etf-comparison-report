<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>指数ETF滑动对比（离线单文件）</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--text:#e7ecf3;--muted:#8b9cb3;--accent:#3b82f6}
*{box-sizing:border-box}
body{font-family:"Segoe UI","PingFang SC",Microsoft YaHei,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px 20px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.muted{color:var(--muted);font-size:.86rem;margin-bottom:10px}
.badge{display:inline-block;background:#134e35;color:#6ee7b7;font-size:.72rem;padding:2px 8px;border-radius:4px;margin-left:6px}
#errBanner{display:none;background:#7f1d1d;color:#fecaca;padding:12px;border-radius:8px;margin-bottom:12px}
.chart-card{background:var(--card);border-radius:12px;padding:16px 18px 18px;margin-bottom:14px}
.chart-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:8px}
select{background:#0f1419;color:var(--text);border:1px solid #2d3a4f;border-radius:8px;padding:8px 12px}
.etf-tags{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.tag{font-size:.76rem;padding:3px 8px;border-radius:999px;background:#0f1419;border:1px solid #2d3a4f}
.canvas-wrap{position:relative;height:min(50vh,400px);margin:6px 0}
.canvas-wrap canvas{width:100%!important;height:100%!important}
.slider-box{margin-top:10px;padding:12px 14px;background:#0f1419;border-radius:10px;border:1px solid #2d3a4f}
.slider-box .hint{font-size:.8rem;color:#93c5fd;margin:0 0 10px}
.range-labels{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:8px}
.range-labels span{font-weight:700;color:#93c5fd}
.range-axis{position:relative;height:34px;margin:0 6px 10px;user-select:none;touch-action:none}
.range-track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:10px;border-radius:5px;background:#2d3a4f}
.range-fill{position:absolute;top:50%;transform:translateY(-50%);height:10px;border-radius:5px;background:linear-gradient(90deg,#10b981,#3b82f6,#f59e0b);pointer-events:none}
.range-thumb{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;border:3px solid #3b82f6;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab;z-index:2}
.range-thumb.end{border-color:#f59e0b}
.range-summary{text-align:center;font-size:.84rem;color:var(--muted);margin-bottom:8px}
.quick-btns{display:flex;flex-wrap:wrap;gap:6px}
.quick-btns button{background:transparent;color:var(--text);border:1px solid #2d3a4f;border-radius:6px;padding:5px 11px;cursor:pointer;font-size:.78rem}
.table-card{background:var(--card);border-radius:12px;padding:14px 16px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid #2d3a4f}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);position:sticky;top:0;background:var(--card)}
.table-wrap{max-height:360px;overflow:auto}
</style>
</head>
<body>
<div id="errBanner">数据加载失败，请重新生成报告文件。</div>
<h1>指数 vs ETF 份额<span class="badge">离线单文件</span></h1>
<p class="muted">更新 2026-08-12 20:07 · 断网可用 · 左轴指数点 / 右轴万份 · 图下方单轴双柄拖动</p>

<div class="chart-card">
  <div class="chart-top">
    <label>类别 <select id="catSelect"><option value="上证50">上证50</option><option value="沪深300">沪深300</option><option value="A500">A500</option><option value="券商">券商</option><option value="创业板">创业板</option><option value="科创板">科创板</option></select></label>
    <div id="etfTags" class="etf-tags"></div>
  </div>
  <div class="canvas-wrap"><canvas id="mainChart"></canvas></div>
  <div class="slider-box">
    <p class="hint">在同一根时间轴上拖动左右圆点选择区间</p>
    <div class="range-labels"><span>起 <span id="startLabel">—</span></span><span>止 <span id="endLabel">—</span></span></div>
    <div class="range-axis" id="rangeAxis">
      <div class="range-track"></div>
      <div class="range-fill" id="rangeFill"></div>
      <div class="range-thumb start" id="thumbStart"></div>
      <div class="range-thumb end" id="thumbEnd"></div>
    </div>
    <div class="range-summary" id="rangeSummary"></div>
    <div class="quick-btns">
      <button type="button" data-preset="all">全部</button>
      <button type="button" data-preset="ytd">今年</button>
      <button type="button" data-preset="1y">近1年</button>
      <button type="button" data-preset="6m">近6月</button>
      <button type="button" data-preset="3m">近3月</button>
    </div>
  </div>
</div>

<div class="table-card">
  <h2 style="font-size:1rem;margin:0 0 8px">数据表</h2>
  <div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
</div>

function getCat(){return window.REPORT_DATA&&window.REPORT_DATA.categories[catSelect.value];}
function sliceRows(cat,s,e){return cat.rows.slice(s,e+1);}
function padScale(vals){if(!vals.length)return{};var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);var pad=Math.max((max-min)*0.05,max*0.002,1);return{min:min-pad,max:max+pad};}
function idxToPct(i){return R.max<=0?0:(i/R.max)*100;}
function pctToIdx(p){if(R.max<=0)return 0;return Math.round(Math.max(0,Math.min(100,p))/100*R.max);}
function updateRangeUI(){var p0=idxToPct(R.start),p1=idxToPct(R.end);thumbStart.style.left=p0+'%';thumbEnd.style.left=p1+'%';rangeFill.style.left=p0+'%';rangeFill.style.width=Math.max(0,p1-p0)+'%';}
function setRange(start,end,doRefresh){if(doRefresh===undefined)doRefresh=true;R.start=Math.max(0,Math.min(start,R.max));R.end=Math.max(R.start,Math.min(end,R.max));updateRangeUI();if(doRefresh)refresh();}
function setupRange(cat){R.max=Math.max(0,cat.rows.length-1);R.start=0;R.end=R.max;updateRangeUI();}
function renderTags(cat){etfTags.innerHTML=cat.etfs.map(function(e,i){return '<span class="tag" style="border-color:'+ETF_COLORS[i%ETF_COLORS.length]+'">'+e.name+' '+e.ts_code+'</span>';}).join('');}
function renderChart(cat,s,e){
  var win=sliceRows(cat,s,e),idxVals=win.map(function(r){return r.index;}),shareVals=[];
  win.forEach(function(r){r.etfs.forEach(function(v){shareVals.push(v);});});
  var datasets=[{label:cat.index_name+' 收盘',data:idxVals,yAxisID:'yIndex',borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,0.08)',fill:true,tension:0.15,pointRadius:0,borderWidth:2.5}];
  cat.etfs.forEach(function(ev,i){datasets.push({label:ev.name+' 份额',data:win.map(function(r){return r.etfs[i];}),yAxisID:'yShare',borderColor:ETF_COLORS[i%ETF_COLORS.length],tension:0.15,pointRadius:0,borderWidth:2});});
  var ia=padScale(idxVals),sa=padScale(shareVals);
  if(chart)chart.destroy();
  if(typeof Chart==='undefined'){alert('Chart.js 未加载');return;}
  chart=new Chart(document.getElementById('mainChart'),{type:'line',data:{labels:win.map(function(r){return r.date_label;}),datasets:datasets},options:{responsive:true,maintainAspectRatio:false,animation:{duration:animFast?0:200},interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{color:'#e7ecf3',boxWidth:12}},tooltip:{callbacks:{label:function(ctx){var v=ctx.parsed.y;return ctx.dataset.yAxisID==='yIndex'?ctx.dataset.label+': '+fmt(v)+' 点':ctx.dataset.label+': '+fmt(v)+' 万份';}}}},scales:{x:{ticks:{color:'#8b9cb3',maxTicksLimit:10},grid:{color:'rgba(139,156,179,0.1)'}},yIndex:{type:'linear',position:'left',min:ia.min,max:ia.max,ticks:{color:'#60a5fa',callback:function(v){return fmt(v,0);}},title:{display:true,text:'指数收盘（点）',color:'#60a5fa'},grid:{color:'rgba(96,165,250,0.1)'}},yShare:{type:'linear',position:'right',min:sa.min,max:sa.max,ticks:{color:'#fbbf24',callback:function(v){return fmt(v,0);}},title:{display:true,text:'ETF份额（万份）',color:'#fbbf24'},grid:{drawOnChartArea:false}}}}});
}
function renderTable(cat,s,e){
  var win=sliceRows(cat,s,e),head='<tr><th>日期</th><th>'+cat.index_name+'(点)</th>';
  cat.etfs.forEach(function(ev){head+='<th>'+ev.name+'</th>';});
  tableHead.innerHTML=head+'</tr>';
  tableBody.innerHTML=win.map(function(r){var tr='<tr><td>'+r.date_label+'</td><td>'+fmt(r.index)+'</td>';r.etfs.forEach(function(v){tr+='<td>'+fmt(v)+'<br><small style="color:#8b9cb3">'+fmtYi(v)+'</small></td>';});return tr+'</tr>';}).join('');
}
function refresh(){
  var cat=getCat();if(!cat||!cat.rows.length)return;
  var rs=cat.rows[R.start],re=cat.rows[R.end];
  startLabel.textContent=rs.date_label;endLabel.textContent=re.date_label;
  rangeSummary.textContent=rs.date_label+' → '+re.date_label+'，共 '+(R.end-R.start+1)+' 个交易日';
  renderTags(cat);renderChart(cat,R.start,R.end);renderTable(cat,R.start,R.end);animFast=false;
}
function applyPreset(preset){
  var cat=getCat();if(!cat)return;var start=0,max=R.max,lastDate=cat.rows[max].date;
  var y=+lastDate.slice(0,4),m=+lastDate.slice(4,6),dt=new Date(y,m-1,+lastDate.slice(6,8));
  if(preset==='ytd')start=cat.rows.findIndex(function(r){return +r.date>=y*10000+101;});
  else if(preset==='1y'){dt.setFullYear(dt.getFullYear()-1);var c1=dt.getFullYear()*10000+(dt.getMonth()+1)*100+dt.getDate();start=cat.rows.findIndex(function(r){return +r.date>=c1;});}
  else if(preset==='6m'){dt.setMonth(dt.getMonth()-6);var c2=dt.getFullYear()*10000+(dt.getMonth()+1)*100+dt.getDate();start=cat.rows.findIndex(function(r){return +r.date>=c2;});}
  else if(preset==='3m'){dt.setMonth(dt.getMonth()-3);var c3=dt.getFullYear()*10000+(dt.getMonth()+1)*100+dt.getDate();start=cat.rows.findIndex(function(r){return +r.date>=c3;});}
  if(start<0)start=0;setRange(start,max);
}
function bindThumb(thumb,which){
  function onMove(clientX){animFast=true;var rect=rangeAxis.getBoundingClientRect();var pct=((clientX-rect.left)/rect.width)*100;var idx=pctToIdx(pct);
    if(which==='start')setRange(Math.min(idx,R.end),R.end);else setRange(R.start,Math.max(idx,R.start));}
  thumb.addEventListener('pointerdown',function(ev){thumb.setPointerCapture(ev.pointerId);onMove(ev.clientX);
    function move(e){onMove(e.clientX);}function up(){try{thumb.releasePointerCapture(ev.pointerId);}catch(x){}window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);}
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);});
}
function init(){
  if(!window.REPORT_DATA){document.getElementById('errBanner').style.display='block';return;}
  if(!catSelect.options.length)return;
  setupRange(getCat());refresh();
  bindThumb(thumbStart,'start');bindThumb(thumbEnd,'end');
  rangeAxis.addEventListener('pointerdown',function(ev){
    if(ev.target.classList.contains('range-thumb'))return;
    var rect=rangeAxis.getBoundingClientRect(),pct=((ev.clientX-rect.left)/rect.width)*100,idx=pctToIdx(pct);
    if(Math.abs(idx-R.start)<=Math.abs(idx-R.end))setRange(idx,R.end);else setRange(R.start,idx);
  });
  catSelect.addEventListener('change',function(){setupRange(getCat());refresh();});
  document.querySelectorAll('.quick-btns button').forEach(function(b){b.addEventListener('click',function(){applyPreset(b.dataset.preset);});});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body>
</html>
